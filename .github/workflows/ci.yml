name: CI

# 这个流水线回答一个问题：「这张提交真的还能跑起来吗？」
# 它不测准确率（那要真模型 + 真 Key，见 eval/），只做编译 + 启动 + 冒烟。
# 关键点：mock 模式让 CI 不依赖 MySQL / Redis / 任何 API Key，公共 runner 上零配置可跑。
#
# 本地等价命令（不联网也能复现）：
#   INSIGHTKB_LLM_MODE=mock PERSIST_ENABLED=false INSIGHTKB_LIMIT_BACKEND=memory \
#     java -jar target/insightkb.jar --server.port=52116
#
# 设计约束：启动与应用探测必须写在**同一个 step**里。跨 step 的后台进程在有些 runner 上
# 会被回收，分开写会出现"上一步明明起来了，下一步 connection refused"的幽灵失败。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: 编译 + 启动 + 端到端冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "8080"
      # 对应 application.yml 的 insightkb.llm.mode / storage.persist / limit.backend
      # Spring Boot 宽松绑定：环境变量 INSIGHTKB_LLM_MODE 会覆盖 insightkb.llm.mode
      INSIGHTKB_LLM_MODE: mock
      PERSIST_ENABLED: "false"
      INSIGHTKB_LIMIT_BACKEND: memory

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 21（项目用到虚拟线程 / record）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 打包可执行 jar
        run: |
          java -version
          mvn -v
          mvn -B -DskipTests package
          ls -lh target/insightkb.jar

      - name: 启动服务 + 端到端冒烟
        run: |
          set -euo pipefail

          # 失败时把 app.log 的末尾逐行打成 ::error:: 注解。
          # 注解在未登录状态也能看到，比 artifact 更好排查（artifact 要登录才能下载）。
          dump_log() {
            local rc=$?
            echo "::error::冒烟失败（rc=$rc），先看异常行："
            grep -E "Exception|Caused by|ERROR" app.log 2>/dev/null | head -n 25 | cut -c1-400 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::error::app.log 末尾 30 行："
            tail -n 30 app.log 2>/dev/null | cut -c1-400 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            return $rc
          }
          trap dump_log ERR

          java -jar target/insightkb.jar --server.port="$PORT" > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          # 1) 等就绪：最多 120 秒。顺便盯着 java 进程，它要是先把日志写完退出了就别干等。
          # 注意这里不用 curl -sf：500 也要把响应体读出来，它才是原因所在。
          HTTP=""
          for i in $(seq 1 60); do
            HTTP=$(curl -s -o info.json -w '%{http_code}' "http://127.0.0.1:$PORT/api/system/info" || true)
            if [ "$HTTP" = "200" ]; then
              echo "服务在第 $i 次探测就绪"
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::java 进程在第 $i 次探测前就退出了"
              break
            fi
            if [ "$HTTP" != "000" ] && [ -n "$HTTP" ]; then
              echo "::error::/api/system/info 返回 $HTTP（第 $i 次探测），响应体："
              head -c 600 info.json | while IFS= read -r line; do echo "::error::${line}"; done
              false
            fi
            sleep 2
          done
          if [ "$HTTP" != "200" ]; then
            echo "::error::/api/system/info 最终状态码 ${HTTP:-无响应}"
            head -c 600 info.json 2>/dev/null | while IFS= read -r line; do echo "::error::${line}"; done
            false
          fi
          cat info.json
          # 断言 1：确实跑在 mock 模式（说明 CI 没偷偷依赖外部 Key）
          grep -q '"code":0' info.json
          grep -q '"mockChat":true' info.json

          # 2) 上传样例文档。接口是异步的，立刻返回 PROCESSING
          curl -sf -X POST \
            -F "file=@samples/设备运维手册-X200.md;filename=x200-manual.md" \
            "http://127.0.0.1:$PORT/api/documents" -o upload.json
          cat upload.json
          grep -q '"code":0' upload.json

          # 3) 轮询到 READY 且 chunkCount > 0，证明清洗/切片/建索引这条链真的跑通了
          for i in $(seq 1 20); do
            curl -sf "http://127.0.0.1:$PORT/api/documents" -o docs.json
            if grep -q '"status":"READY"' docs.json && grep -qE '"chunkCount":[1-9]' docs.json; then
              echo "切块完成（第 $i 次轮询）"
              break
            fi
            sleep 1
          done
          cat docs.json
          grep -q '"status":"READY"' docs.json
          grep -qE '"chunkCount":[1-9]' docs.json

          # 4) 问答：注意是 /api/chat/stream（POST /api/chat 是 500）
          printf '%s' '{"question":"X200 的额定功率是多少？","conversationId":"ci-smoke"}' > body.json
          curl -sf -N -X POST -H "Content-Type: application/json" \
            --data-binary @body.json \
            "http://127.0.0.1:$PORT/api/chat/stream" -o stream.txt

          # 断言 2：SSE 有增量输出，且有结束事件
          grep -q '"type":"delta"' stream.txt
          grep -q '"type":"done"' stream.txt
          # 断言 3：没有走降级分支（degraded=true 意味着模型调用失败、只回检索片段）
          if grep -q '"degraded":true' stream.txt; then
            echo "::error::问答走了降级分支，模型调用没成功"
            exit 1
          fi
          echo "冒烟通过 ✅"

      - name: 失败时把日志带上来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            app.log
            info.json
            docs.json
            stream.txt
            upload.json
          if-no-files-found: ignore
          retention-days: 7