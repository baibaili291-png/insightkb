# Nginx 反向代理：把 80 端口的请求转给 InsightKB（app:8080）。
#
# 关键配置点：
# 1. SSE 流式问答必须关闭 proxy_buffering，否则前端要等全部 token 生成完才一次性收到，
#    体感就是"点完提问卡很久，然后整段蹦出来"。
# 2. proxy_read_timeout 设长一点，避免模型慢生成时被 Nginx 提前断连接。
# 3. X-Forwarded-For 透传，让应用侧的限流按真实客户端 IP 维度生效
#    （否则所有请求都来自 Nginx，限流会退化成"全局限一个人"）。

server {
    listen 80;
    server_name _;

    # 知识库文档上传，放宽到 50MB（与 Spring 的 multipart.max-file-size 对齐）
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 相关
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
