# InsightKB 一键编排：应用 + MySQL + Redis + Nginx 反向代理
#
# 用法：
#   1) 准备密钥（任选其一）：
#        a. 在当前目录放 .env.local（LLM_API_KEY / DB_PASSWORD），compose 会自动读取；
#        b. 直接 export LLM_API_KEY=... DB_PASSWORD=... 再 docker compose up。
#       LLM_API_KEY 留空也能起（聊天会回退到 mock 模式，便于先验证链路）。
#   2) docker compose up --build
#   3) 浏览器打开 http://localhost  （Nginx 在 80，把请求转给 app:8080）
#
# 说明：MySQL 首次启动会自动执行 ./db/schema.sql 建表；持久化数据落在具名卷里。

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-insightkb}
      MYSQL_DATABASE: insightkb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-insightkb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # 生产建议加 requirepass；这里演示用，仅开 LRU 淘汰保护内存
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # 数据源指向 compose 内的 mysql 服务
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: insightkb
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-insightkb}
      # 限流 / 会话热缓存指向 compose 内的 redis 服务
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # DeepSeek / 智谱 / 硅基流动 等 OpenAI 兼容 Key；留空则回退 mock
      LLM_API_KEY: ${LLM_API_KEY:}
      PERSIST_ENABLED: "true"
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
